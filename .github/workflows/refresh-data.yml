name: Refresh Top 250 Data

on:
  schedule:
    # 1st of each month at 06:17 UTC
    - cron: '17 6 1 * *'
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Restore TMDB cache
        uses: actions/cache@v4
        with:
          path: scripts/.cache
          key: tmdb-cache-${{ hashFiles('scripts/criteria.ts') }}
          restore-keys: |
            tmdb-cache-

      - name: Restore IMDb dataset cache
        uses: actions/cache@v4
        with:
          path: scripts/downloads
          key: imdb-downloads-${{ github.run_id }}
          restore-keys: |
            imdb-downloads-

      - name: Install dependencies
        run: npm ci

      - name: Build data
        env:
          TMDB_READ_TOKEN: ${{ secrets.TMDB_READ_TOKEN }}
        run: npm run build-data

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet public/data/; then
            echo "No data changes, skipping commit."
          else
            git add public/data/top250.json public/data/history.json
            git commit -m "Refresh Top 250 data ($(date +%Y-%m-%d))"
            git push
          fi
